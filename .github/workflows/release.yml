name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  windows-linux:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore 'src/ScreenToSearch/ScreenToSearch.csproj' --configfile NuGet.Config -r win-x64
      - name: Publish Windows app
        run: dotnet publish 'src/ScreenToSearch/ScreenToSearch.csproj' -c Release -r win-x64 --self-contained true --no-restore -o publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
      - name: Verify packaged OCR and selection
        shell: pwsh
        run: |
          Remove-Item publish/*.lib -ErrorAction SilentlyContinue
          $files = @(Get-ChildItem publish -Recurse -File)
          if ($files.Count -gt 10) { throw "Windows package is not compact: $($files.Count) files" }
          if (Test-Path publish/models/v5) { throw "Obsolete v5 OCR models are present" }
          foreach ($name in 'PP-OCRv6_det_small.onnx', 'PP-OCRv6_rec_small.onnx', 'ppocrv6_small_dict.txt') {
            if (!(Test-Path "publish/models/v6/$name")) { throw "Missing v6 OCR model: $name" }
          }
          $test = Start-Process -FilePath (Resolve-Path publish/ScreenToSearch.exe) -ArgumentList '--stage2-selftest', 'stage2-report.json' -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw "Stage-two self-test exited with $($test.ExitCode)" }
          $report = Get-Content stage2-report.json -Raw | ConvertFrom-Json
          if ($report.passed -ne $true) { throw "Stage-two self-test failed: $($report.error)" }
          $test = Start-Process -FilePath (Resolve-Path publish/ScreenToSearch.exe) -ArgumentList '--ocr-lifecycle-selftest', 'ocr-lifecycle-report.json' -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw "OCR lifecycle self-test exited with $($test.ExitCode)" }
          $report = Get-Content ocr-lifecycle-report.json -Raw | ConvertFrom-Json
          if ($report.passed -ne $true) { throw "OCR lifecycle self-test failed: $($report.error)" }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify shared Linux and macOS OCR lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install "rapidocr>=3.10.0" onnxruntime
          python -m unittest discover -s linux/tests -v
          python linux/tests/ocr_smoke.py
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath ScreenToSearch-win-x64.zip
          New-Item -ItemType Directory -Path linux-package/linux/models -Force | Out-Null
          Copy-Item -Path linux/* -Destination linux-package/linux -Recurse
          Copy-Item -Path src/ScreenToSearch/models/v6 -Destination linux-package/linux/models -Recurse
          Copy-Item -Path README.md,LICENSE,APACHE-2.0-LICENSE.txt,THIRD_PARTY_LICENSES.txt -Destination linux-package
          Compress-Archive -Path linux-package/* -DestinationPath ScreenToSearch-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenToSearch-win-linux
          path: |
            ScreenToSearch-win-x64.zip
            ScreenToSearch-linux.zip

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PP-OCRv6 runtime
        run: python -m pip install "rapidocr>=3.10.0" onnxruntime pyinstaller
      - name: Recognize text with bundled models
        run: python linux/tests/ocr_smoke.py
      - name: Build macOS app
        run: sh macos/build-app.sh
      - name: Check app resources and overlay selection
        run: |
          macos/dist/'Screen to Search.app'/Contents/MacOS/ScreenToSearchMac --check
          macos/dist/'Screen to Search.app'/Contents/MacOS/ScreenToSearchMac --overlay-selftest
          python macos/tests/smoke_ocr.py
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent macos/dist/'Screen to Search.app' ScreenToSearch-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenToSearch-macos-${{ matrix.arch }}
          path: ScreenToSearch-macos-${{ matrix.arch }}.zip

  package-check:
    needs: [windows-linux, macos]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: ScreenToSearch-*
          path: dist
          merge-multiple: true
      - name: Check packages and calculate checksums
        run: |
          cd dist
          for name in ScreenToSearch-win-x64.zip ScreenToSearch-linux.zip ScreenToSearch-macos-arm64.zip ScreenToSearch-macos-x64.zip; do
            test -s "$name"
          done
          sha256sum ScreenToSearch-*.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/ScreenToSearch-*.zip
            dist/SHA256SUMS.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ScreenToSearch-*.zip dist/SHA256SUMS.txt --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "Screen to Search $GITHUB_REF_NAME" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/ScreenToSearch-*.zip dist/SHA256SUMS.txt --title "Screen to Search $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/ScreenToSearch-*.zip dist/SHA256SUMS.txt --title "Screen to Search $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
