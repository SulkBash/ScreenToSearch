name: Linux checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: python3 -m compileall -q linux
      - name: Run Linux unit tests
        run: python3 -m unittest discover -s linux/tests -v
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install v6 OCR runtime
        run: python -m pip install "rapidocr>=3.10.0" onnxruntime
      - name: Recognize text with packaged PP-OCRv6 models
        run: python linux/tests/ocr_smoke.py
      - name: Install GTK smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 xvfb mutter dbus-x11
      - name: Construct Wayland capture overlay
        run: xvfb-run -a /usr/bin/python3 linux/tests/gtk_smoke.py
      - name: Exercise X11 shortcut and shared overlay
        run: |
          sudo apt-get install -y python3-xlib maim
          xvfb-run -a /usr/bin/python3 linux/tests/x11_smoke.py
      - name: Construct capture overlay on headless Wayland
        env:
          GDK_BACKEND: wayland
          XDG_SESSION_TYPE: wayland
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- mutter --wayland --headless --virtual-monitor=1280x800 -- /usr/bin/python3 linux/tests/wayland_smoke.py
      - name: Install GNOME Shell and portals
        run: sudo apt-get install -y gnome-shell xdg-desktop-portal xdg-desktop-portal-gnome
      - name: Open a Global Shortcuts session in headless GNOME
        env:
          XDG_CURRENT_DESKTOP: GNOME
          XDG_SESSION_TYPE: wayland
          GDK_BACKEND: wayland
          LIBGL_ALWAYS_SOFTWARE: '1'
          WAYLAND_DISPLAY: wayland-sts
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_DATA_HOME="$(mktemp -d)"
          /usr/bin/python3 linux/screen_to_search.py --install-desktop
          dbus-run-session -- bash linux/tests/run_portal_smoke.sh
      - name: Install KDE Plasma and portals
        run: sudo apt-get install -y kwin-wayland plasma-workspace xdg-desktop-portal-kde
      - name: Open a Global Shortcuts session in headless KDE Plasma
        env:
          XDG_CURRENT_DESKTOP: KDE
          XDG_SESSION_TYPE: wayland
          GDK_BACKEND: wayland
          QT_QPA_PLATFORM: wayland
          LIBGL_ALWAYS_SOFTWARE: '1'
          WAYLAND_DISPLAY: wayland-sts-kde
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_DATA_HOME="$(mktemp -d)"
          /usr/bin/python3 linux/screen_to_search.py --install-desktop
          dbus-run-session -- bash linux/tests/run_kde_portal_smoke.sh
