name: Linux checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: python3 -m compileall -q linux
      - name: Run Linux unit tests
        run: python3 -m unittest discover -s linux/tests -v
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install v6 OCR runtime
        run: python -m pip install rapidocr onnxruntime
      - name: Recognize text with packaged PP-OCRv6 models
        run: python linux/tests/ocr_smoke.py
      - name: Install GTK smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 xvfb mutter dbus-x11
      - name: Construct GNOME capture overlay
        run: xvfb-run -a /usr/bin/python3 linux/tests/gtk_smoke.py
      - name: Construct capture overlay on headless Wayland
        env:
          GDK_BACKEND: wayland
          XDG_SESSION_TYPE: wayland
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- mutter --wayland --no-x11 --sm-disable --headless --virtual-monitor=1280x800 -- /usr/bin/python3 linux/tests/wayland_smoke.py
