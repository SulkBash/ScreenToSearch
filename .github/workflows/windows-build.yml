name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore 'src/ScreenToSearch/ScreenToSearch.csproj' --configfile NuGet.Config
      - name: Build
        run: dotnet build 'src/ScreenToSearch/ScreenToSearch.csproj' -c Release --no-restore
